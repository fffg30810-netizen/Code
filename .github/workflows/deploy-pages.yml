# Pubblica elden-hologram-ar su GitHub Pages.
#
# Il sito viene compilato e pubblicato in DUE modi, così funziona qualunque
# sorgente sia selezionata in Settings → Pages:
#   1. artefatto Pages  → sorgente "GitHub Actions"
#   2. branch gh-pages  → sorgente "Deploy from a branch: gh-pages / (root)"
#
# I modelli 3D dei boss vengono scaricati durante la build (`npm run fetch-models`),
# quindi il sito è autonomo e non dipende dal CDN di generazione.
name: Deploy Elden Hologram AR

on:
  push:
    branches: [main, claude/elden-ring-hologram-ar-spi8dn]
    paths:
      - 'elden-hologram-ar/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elden-hologram-ar
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: elden-hologram-ar/package-lock.json
      - run: npm ci
      - name: Scarica i modelli 3D dei boss
        run: npm run fetch-models
        continue-on-error: true
      - run: npm run build
      - name: Prepara il sito
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: elden-hologram-ar/dist
      - name: Pubblica sul branch gh-pages
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build del sito da ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
